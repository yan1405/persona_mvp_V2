<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>T4.6 — Narrative Score</title>
<link rel="stylesheet" href="_ds/persona-design-system-ff1a7bce-a6f2-4fa9-af99-a6196b748678/tokens/fonts.css">
<link rel="stylesheet" href="_ds/persona-design-system-ff1a7bce-a6f2-4fa9-af99-a6196b748678/tokens/colors.css">
<link rel="stylesheet" href="_ds/persona-design-system-ff1a7bce-a6f2-4fa9-af99-a6196b748678/tokens/typography.css">
<link rel="stylesheet" href="_ds/persona-design-system-ff1a7bce-a6f2-4fa9-af99-a6196b748678/tokens/spacing.css">
<link rel="stylesheet" href="_ds/persona-design-system-ff1a7bce-a6f2-4fa9-af99-a6196b748678/tokens/effects.css">
<link rel="stylesheet" href="_ds/persona-design-system-ff1a7bce-a6f2-4fa9-af99-a6196b748678/styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds/persona-design-system-ff1a7bce-a6f2-4fa9-af99-a6196b748678/_ds_bundle.js"></script>
<style>
body{margin:0;background:#E9E8F0;font-family:var(--font-body);color:var(--text-strong)}
a{color:var(--brand)}a:hover{color:var(--brand-strong)}
.rv{position:relative;z-index:100;background:#E9E8F0;padding:14px 20px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--n-100)}
.rv-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rv-lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--n-600);margin-right:4px;min-width:72px}
.rv-title{font-family:var(--font-display);font-size:16px;font-weight:700;letter-spacing:-.01em;margin-right:8px}
.rv-desc{margin:0;font-size:13px;color:var(--text-body);max-width:960px;text-wrap:pretty}
.stage{padding:20px}
.stage-frame{border-radius:12px;overflow:clip;box-shadow:var(--shadow-soft)}
.inicio-root [data-agent]{overflow:clip!important;flex:1 1 auto;align-self:stretch}
.inicio-root [data-agent]>main{overflow:clip!important}
.inicio-root [data-shell-scroll]{overflow:visible!important}
.inicio-root [data-agent]>:first-child{position:sticky!important;top:16px;align-self:flex-start;height:calc(100vh - 32px)!important}
.inicio-rail{position:sticky;top:0;height:100vh}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head>
<body><div id="root"></div>
<script type="text/babel" src="inicio-screen.jsx"></script>
<script type="text/babel" src="score-panel.jsx"></script>
<script type="text/babel">
const { Chip } = window.PersonaDesignSystem_ff1a7b;
/* [id, rótulo, estado do Início que aciona, descrição] */
const GROUPS = [
  ['Início', [['inicio', 'Início (painel fechado)', 'completo', 'Ponto de partida: o botão “Entender o Score” do cartão Narrative Score abre o painel. Ao fechar (Esc, X ou fundo), o foco volta a ele.']]],
  ['Dados', [
    ['dados-insuficientes', 'Dados insuficientes', 'calculando', 'Sem número: dimensões “Dados insuficientes”, Histórico vazio, atualização indisponível.'],
    ['historico-vazio', 'Histórico vazio', 'vazio', 'Nenhum registro ainda: tudo aponta para o Diário.'],
    ['snapshot', 'Snapshot disponível', 'completo', 'Score 65, Base declarada, confiança Inicial. Histórico com 1 snapshot em EntryCard. Atualização elegível.'],
  ]],
  ['Atualização', [
    ['elegivel', 'Elegível', 'completo', 'Atualizar Coerência é ação explícita; clique para ver Calculando e depois Cálculo concluído com novo snapshot.'],
    ['nao-elegivel', 'Não elegível', 'completo', 'Sem evidência nova: botão desabilitado com o motivo escrito.'],
    ['calculando', 'Calculando', 'completo', 'Snapshot anterior preservado; “Cancelar” volta ao estado anterior.'],
    ['concluido', 'Cálculo concluído', 'completo', 'Novo snapshot no topo do Histórico (“Atual”); o anterior vira “Anterior”. Valores e método não mudam.'],
    ['falha-coerencia', 'Falha da Coerência', 'falha', 'Falha recuperável: snapshot anterior preservado, “Tentar de novo” disponível.'],
  ]],
  ['Agente', [['agente-off', 'Agente indisponível', 'falha', 'Histórico e explicação seguem acessíveis; só “Pedir explicação ao Agente” fica desabilitado, com motivo.']]],
];
const ALL = GROUPS.flatMap(g => g[1]);
const VH = { 1440: 900, 1280: 800, 1024: 768 };
const KEY = 'persona.t46.review';
function Host({ scn, st, w, scale, onNav }) {
  const [open, setOpen] = React.useState(false);
  const wrap = React.useRef(null);
  const opener = () => [...wrap.current.querySelectorAll('button')].find(b => /Entender o Score/.test(b.textContent));
  const openIt = b => { if (b) b.focus(); const r = wrap.current.getBoundingClientRect(); if (r.top > 0) window.scrollTo({ top: r.top + window.scrollY }); setOpen(true); };
  React.useEffect(() => { if (scn !== 'inicio') { const t = setTimeout(() => openIt(opener()), 120); return () => clearTimeout(t); } }, []);
  const onClick = e => { const b = e.target.closest && e.target.closest('button'); if (b && /Entender o Score/.test(b.textContent) && !open) openIt(b); };
  const [ih, setIh] = React.useState(window.innerHeight);
  React.useEffect(() => { const f = () => setIh(window.innerHeight); f(); window.addEventListener('resize', f); const t = setTimeout(f, 300); return () => { window.removeEventListener('resize', f); clearTimeout(t); }; }, [open]);
  const vh = Math.round(Math.max(ih, 300) / scale);
  return <div ref={wrap} onClick={onClick} style={{ position: 'relative', width: w }}>
    <div style={{ position: 'sticky', top: 0, height: 0, zIndex: 60, pointerEvents: 'none' }}>
      <div style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: vh, pointerEvents: open ? 'auto' : 'none' }}>
        {open ? <NarrativePanel scn={scn} onClose={() => setOpen(false)} onDiario={() => { setOpen(false); onNav('Navegação para o Diário (T4.2). Nada foi alterado no Score.'); }} /> : null}
      </div>
    </div>
    <div inert={open ? '' : undefined}><InicioScreen stateKey={st} width={w} /></div>
  </div>;
}
function Review() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
  const qs = new URLSearchParams(location.search);
  const [v, setV] = React.useState(qs.get('s') || saved.v || 'snapshot');
  const [w, setW] = React.useState(+qs.get('w') || saved.w || 1440);
  const [nav, setNav] = React.useState('');
  const [key, setKey] = React.useState(0);
  const stageRef = React.useRef(null);
  const [avail, setAvail] = React.useState(0);
  React.useLayoutEffect(() => { const el = stageRef.current; if (!el) return; const f = () => setAvail(el.clientWidth - 40); f(); const ro = new ResizeObserver(f); ro.observe(el); return () => ro.disconnect(); }, []);
  React.useEffect(() => { try { localStorage.setItem(KEY, JSON.stringify({ v, w })); } catch (e) {} }, [v, w]);
  const scale = avail > 0 ? Math.max(0.3, Math.min(1, avail / w)) : 1;
  const cur = ALL.find(x => x[0] === v) || ALL[2];
  const pick = id => { setV(id); setNav(''); setKey(k => k + 1); };
  return <>
    <div className="rv">
      <div className="rv-row"><span className="rv-title">T4.6 — Narrative Score</span>
        <span className="rv-lbl">Largura</span>
        {[1440, 1280, 1024].map(x => <Chip key={x} size="sm" selected={w === x} onClick={() => setW(x)}>{x + ' × ' + VH[x]}</Chip>)}
      </div>
      {GROUPS.map(([g, items]) => <div key={g} className="rv-row"><span className="rv-lbl">{g}</span>{items.map(([id, label]) => <Chip key={g + label} size="sm" selected={v === id} onClick={() => { pick(id); }}>{label}</Chip>)}</div>)}
      <p className="rv-desc" role="status">{cur[3]} {nav} Largura {w}; altura natural, a página rola.{scale < 1 ? ' Pré-visualização reduzida a ' + Math.round(scale * 100) + '%.' : ''} Datas e links: dados sintéticos para demonstração.</p>
    </div>
    <div className="stage" ref={stageRef} data-screen-label={cur[1] + ' · ' + w}>
      <div className="stage-frame" style={{ width: w, zoom: scale }}>
        <Host key={v + w + key} scn={v} st={cur[2]} w={w} scale={scale} onNav={setNav} />
      </div>
    </div>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Review />);
</script>
</body></html>
