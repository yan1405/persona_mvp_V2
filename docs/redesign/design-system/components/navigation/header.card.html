<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--bg-app);font-family:var(--font-body);color:var(--text-strong)}.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin:0 0 8px}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}.col{display:flex;flex-direction:column;gap:20px}</style></head><body><div id="r"></div>
<script type="text/babel">
const NS = window.PersonaDesignSystem_ff1a7b;
const { AppHeader, AgentPanel } = NS;
const MSGS = [
  { role: 'user', text: 'O que falta para meu score sair da base declarada?' },
  { role: 'agent', text: 'Para a Coerência observada falta 1 evidência confirmada (hoje: 4 de 5). Revisar as 2 sugestões do Diário resolve esse ponto.', citations: ['Sugestões do Diário', 'Como é calculado'], actions: ['Revisar sugestões'] },
];
const bar = { background:'var(--n-25)', borderRadius:28, padding:'12px 16px', boxShadow:'var(--shadow-soft)' };
function Demo({initial}){const [o,setO]=React.useState(initial);return <div style={{display:'flex',gap:16,alignItems:'stretch'}}>
  <div style={{flex:1,minWidth:0}}><div style={bar}><AppHeader agentOpen={o} onAgentToggle={setO} /></div></div>
  {o ? <AgentPanel open screen="Início" messages={MSGS} onToggle={setO} composerProps={{suggestions:[]}} style={{height:680}} /> : null}
</div>}
function App(){return <div className="col">
<div><p className="lbl">Agente fechado</p><Demo initial={false} /></div>
<div><p className="lbl">Agente aberto (clique no botão para alternar)</p><Demo initial={true} /></div>
</div>}
ReactDOM.createRoot(document.getElementById('r')).render(<App />);
</script></body></html>
