<!-- @dsCard group="Components" viewport="1000x720" name="FloatingPanel" subtitle="Detalhe em painel · prende o foco · Esc fecha · um painel por vez · seções com SectionIndex" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--bg-app);font-family:var(--font-body);color:var(--text-strong)}.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin:0 0 8px}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}.col{display:flex;flex-direction:column;gap:20px}</style></head><body><div id="r"></div>
<script type="text/babel">
const NS = window.PersonaDesignSystem_ff1a7b;
const { FloatingPanel, SectionIndex, TraceLine, Badge, Chip, Button, Input, EvidenceCard } = NS;
const Sec = ({id,title,children}) => <section id={id} style={{display:'flex',flexDirection:'column',gap:10,paddingBottom:22,marginBottom:22,borderBottom:'1px solid var(--divider)'}}><h3 style={{margin:0,fontFamily:'var(--font-display)',fontSize:16,fontWeight:700,letterSpacing:'-0.01em'}}>{title}</h3>{children}</section>;
function Body({ev}){
  const items = ev===1 ? [{id:'a-resumo',label:'Resumo'},{id:'a-provas',label:'Provas',meta:'2 links'},{id:'a-uso',label:'Uso',meta:'2'},{id:'a-rastro',label:'Rastreabilidade'}]
    : [{id:'b-resumo',label:'Resumo'},{id:'b-provas',label:'Provas',meta:'0'},{id:'b-uso',label:'Uso',disabled:true,meta:'sem uso'},{id:'b-rastro',label:'Rastreabilidade'}];
  return <div style={{display:'grid',gridTemplateColumns:'150px minmax(0,1fr)',gap:24,alignItems:'start'}}>
    <SectionIndex items={items} style={{position:'sticky',top:0}} />
    {ev===1 ? <div>
      <Sec id="a-resumo" title="Resumo"><div style={{display:'flex',gap:6,flexWrap:'wrap'}}><Badge status="documentada" /><Chip size="sm">Automação</Chip><Chip size="sm">Análise de dados</Chip></div></Sec>
      <Sec id="a-provas" title="Provas"><span style={{fontSize:14}}>2 links de prova validados.</span></Sec>
      <Sec id="a-uso" title="Uso"><span style={{fontSize:14,lineHeight:1.6}}>Resposta STAR · Problema resolvido com dados<br/>Pitch pessoal · Rascunho<br/>Persona Live · Analista júnior de IA generativa · Empresa Aurora (fictícia)</span></Sec>
      <Sec id="a-rastro" title="Rastreabilidade"><TraceLine title="Origem e uso" orientation="vertical" steps={[{kind:'registro',label:'Registro de origem',meta:'Texto original preservado'},{kind:'evidencia',label:'Evidência confirmada',meta:'Documentada'},{kind:'prova',label:'2 links de prova'},{kind:'uso',label:'Resposta STAR · Problema resolvido com dados'}]} /></Sec>
    </div> : <div>
      <Sec id="b-resumo" title="Resumo"><div style={{display:'flex',gap:6,flexWrap:'wrap'}}><Badge status="registrada" /><Chip size="sm">Ensino</Chip><Chip size="sm">Liderança</Chip></div></Sec>
      <Sec id="b-provas" title="Provas"><Input label="Link de prova" defaultValue="oficina-python" error="Link inválido. Use um endereço que comece com http:// ou https://" /></Sec>
      <Sec id="b-rastro" title="Rastreabilidade"><TraceLine title="Origem e uso" orientation="vertical" steps={[{kind:'registro',label:'Registro de origem'},{kind:'evidencia',label:'Evidência confirmada',meta:'Registrada'},{kind:'prova',label:'Sem link de prova',state:'gap'}]} /></Sec>
    </div>}
  </div>;
}
function App(){const [open,setOpen]=React.useState(1);
return <div style={{position:'relative',height:680,borderRadius:28,background:'var(--n-25)',overflow:'hidden',padding:24,boxSizing:'border-box'}}>
  <p className="lbl">Lista preservada atrás do painel · abrir outro fecha o atual · Esc fecha</p>
  <div style={{display:'grid',gridTemplateColumns:'repeat(2,minmax(0,260px))',gap:12}}>
    <EvidenceCard title="Automação de relatórios semanais com IA generativa" competencies={['Automação','Análise de dados']} level="Documentada" proofCount={2} origin="Diário" onOpen={()=>setOpen(1)} />
    <EvidenceCard title="Oficina de Python para calouros" competencies={['Ensino','Liderança']} level="Registrada" proofCount={0} origin="Diário" onOpen={()=>setOpen(2)} />
  </div>
  <FloatingPanel contained width={600} open={open===1} onClose={()=>setOpen(0)} eyebrow="Evidência 1" title="Automação de relatórios semanais com IA generativa" footer={<><Button variant="outline" onClick={()=>setOpen(2)}>Abrir evidência 4</Button><Button variant="solid" icon="mic">Testar no Live</Button></>}><Body ev={1} /></FloatingPanel>
  <FloatingPanel contained width={600} open={open===2} onClose={()=>setOpen(0)} eyebrow="Evidência 4" title="Oficina de Python para calouros" footer={<Button variant="solid" icon="link">Adicionar link de prova</Button>}><Body ev={2} /></FloatingPanel>
</div>}
ReactDOM.createRoot(document.getElementById('r')).render(<App />);
</script></body></html>
