<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>body{margin:0;padding:20px;background:var(--bg-app);font-family:var(--font-body);color:var(--text-strong)}.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin:0 0 8px}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}.col{display:flex;flex-direction:column;gap:20px}</style></head><body><div id="r"></div>
<script type="text/babel">
const NS = window.PersonaDesignSystem_ff1a7b;
const { TraceLine } = NS;
const E1 = [
  { kind: 'registro', label: 'Registro de origem', meta: 'Texto original preservado' },
  { kind: 'evidencia', label: 'Automação de relatórios semanais com IA generativa', meta: 'Documentada' },
  { kind: 'prova', label: '2 links de prova' },
  { kind: 'uso', label: 'Resposta STAR · Problema resolvido com dados', meta: 'Revisado' },

  { kind: 'prova', label: 'Sem link de prova', meta: 'Um link a torna Documentada', state: 'gap' },
  { kind: 'uso', label: 'Ainda não usada', state: 'gap' },
];
const SUG = [
  { kind: 'registro', label: 'Registro de ontem', meta: 'Texto original preservado' },
  { kind: 'sugestao', label: 'Organização do cronograma de entregas do semestre', meta: 'Para revisar' },
  { kind: 'evidencia', label: 'Aguardando sua confirmação', state: 'gap' },

const ERR = [E1[0], E1[1], { kind: 'prova', label: 'Link inválido', meta: 'Use um endereço que comece com http:// ou https://', state: 'error' }, E1[3]];
const card = { background:'var(--surface-card)', borderRadius:22, boxShadow:'var(--shadow-soft)', padding:20 };
function App(){return <div className="col">

<div><p className="lbl">Lacuna · Registrada sem prova (evidência 4)</p><div style={card}><TraceLine steps={E4} onStep={()=>{}} /></div></div>
<div className="g2">
<div><p className="lbl">Sugestão para revisar · vertical</p><div style={card}><TraceLine orientation="vertical" steps={SUG} /></div></div>
<div className="col" style={{gap:16}}><div><p className="lbl">Erro · link inválido</p><div style={card}><TraceLine orientation="vertical" steps={ERR.slice(1,3)} /></div></div>
<div><p className="lbl">Desabilitado · arquivada</p><div style={card}><TraceLine orientation="vertical" steps={E1.slice(1,3)} archived /></div></div></div>
</div>
</div>}
ReactDOM.createRoot(document.getElementById('r')).render(<App />);
