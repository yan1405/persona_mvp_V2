<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">

<style>body{margin:0;padding:20px;background:var(--bg-app);font-family:var(--font-body);color:var(--text-strong)}.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin:0 0 8px}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}.col{display:flex;flex-direction:column;gap:20px}</style></head><body><div id="r"></div>
<script type="text/babel">
const NS = window.PersonaDesignSystem_ff1a7b;
const { DraftPanel } = NS;
const T = 'Um exemplo real é a automação de relatórios semanais com IA generativa. Nesse trabalho usei automação e análise de dados, e a evidência está documentada com 2 links de prova.';
function App(){return <div className="col">
<div><p className="lbl">Padrão · preenchido (comportamental, 30–45 s)</p><DraftPanel text={T} sources={['Evidência 1']} /></div>
<div><p className="lbl">Foco · Encurtar</p><DraftPanel text={T} sources={['Evidência 1']} focused /></div>
<div><p className="lbl">Processando</p><DraftPanel state="processing" /></div>
<div><p className="lbl">Lacuna · sem rascunho</p><DraftPanel state="gap" /></div>
<div><p className="lbl">Erro · falha parcial</p><DraftPanel state="error" /></div>
<div><p className="lbl">Desabilitado · sessão encerrada</p><DraftPanel state="closed" text={T} sources={['Evidência 1']} /></div>
</div>}
