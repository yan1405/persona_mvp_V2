<!-- @dsCard group="Components" viewport="700x1700" name="ArgumentPanel" subtitle="Persona Live · Argumentos reais · sustentado, foco, processando, lacuna, erro, encerrada" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--bg-app);font-family:var(--font-body);color:var(--text-strong)}.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin:0 0 8px}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}.col{display:flex;flex-direction:column;gap:20px}</style></head><body><div id="r"></div>
<script type="text/babel">
const NS = window.PersonaDesignSystem_ff1a7b;
const { ArgumentPanel } = NS;
const Q = 'Conte sobre uma vez em que você automatizou um processo.';
const ITEMS = [{ fact: 'Automação de relatórios semanais com IA generativa', competencies: ['Automação','Análise de dados'], source: 'Evidência 1', level: 'documentada' }];
const AVOID = 'tempo economizado ou números de impacto — a evidência 1 não registra esses dados.';
function App(){return <div className="col">
<div><p className="lbl">Padrão · resposta sustentada (preenchido)</p><ArgumentPanel question={Q} items={ITEMS} avoid={AVOID} onSource={()=>{}} /></div>
<div><p className="lbl">Foco · origem da evidência</p><ArgumentPanel question={Q} items={ITEMS} avoid={AVOID} onSource={()=>{}} focused /></div>
<div><p className="lbl">Processando · pergunta preservada</p><ArgumentPanel state="processing" question={Q} /></div>
<div><p className="lbl">Lacuna</p><ArgumentPanel state="gap" question="Fale de um conflito em equipe." missing={['Uma situação de conflito em equipe que você viveu','O que você fez e o que mudou depois']} onRegister={()=>{}} /></div>
<div><p className="lbl">Erro · falha parcial</p><ArgumentPanel state="error" question={Q} /></div>
<div><p className="lbl">Desabilitado · sessão encerrada</p><ArgumentPanel state="closed" question={Q} items={ITEMS} avoid={AVOID} /></div>
</div>}
ReactDOM.createRoot(document.getElementById('r')).render(<App />);
</script></body></html>
