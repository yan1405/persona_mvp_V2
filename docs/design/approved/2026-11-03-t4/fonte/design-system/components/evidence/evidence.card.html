<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>body{margin:0;padding:20px;background:var(--bg-app);font-family:var(--font-body);color:var(--text-strong)}.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin:0 0 8px}.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:20px}</style></head><body><div id="r"></div>
<script type="text/babel">
const { EvidenceCard } = window.PersonaDesignSystem_ff1a7b;
const ev1 = { title: 'Automação de relatórios semanais com IA generativa', competencies: ['Automação', 'Análise de dados'], level: 'Documentada', proofCount: 2 };
const ev4 = { title: 'Oficina de Python para calouros', competencies: ['Ensino', 'Liderança'], level: 'Registrada', proofCount: 0 };
function App() {
  const [sel, setSel] = React.useState({ a: true, b: false });
  return <div>
    <p className="lbl">Card de grade</p>
    <div className="g"><EvidenceCard {...ev1} onOpen={() => {}} /><EvidenceCard {...ev4} onOpen={() => {}} /></div>
    <p className="lbl">Sugestão para revisar</p>
    <div className="g" style={{ gridTemplateColumns: 'minmax(0,1fr)' }}><EvidenceCard variant="suggestion" title="Organização do cronograma de entregas do semestre" level="Registrada" proofCount={0} origin="Diário" updatedAt="ontem" /></div>
    <p className="lbl">Selecionável</p>
    <div className="g" style={{ marginBottom: 0 }}>
      <EvidenceCard variant="selectable" {...ev1} reason="Sustenta o argumento principal para “Conte sobre uma vez em que você automatizou um processo.”" selected={sel.a} onSelectedChange={v => setSel(s => ({ ...s, a: v }))} />
      <EvidenceCard variant="selectable" {...ev4} selected={sel.b} onSelectedChange={v => setSel(s => ({ ...s, b: v }))} />
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('r')).render(<App />);
</script></body></html>
