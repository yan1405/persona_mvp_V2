<!-- @dsCard group="Components" viewport="700x1680" name="StepFlow" subtitle="Etapa N de M · Voltar / Continuar · padrão, foco, preenchido, erro, desabilitado" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--bg-app);font-family:var(--font-body);color:var(--text-strong)}.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin:0 0 8px}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}.col{display:flex;flex-direction:column;gap:20px}</style></head><body><div id="r"></div>
<script type="text/babel">
const NS = window.PersonaDesignSystem_ff1a7b;
const { StepFlow, Input, Chip } = NS;
const EV = ['Automação de relatórios semanais com IA generativa','Pitch de 5 minutos para banca de empreendedorismo','Entrevistas com 8 usuários para validar o problema'];
const TYPES = ['Resposta STAR','Pitch pessoal','Currículo ATS','Portfólio por casos'];
function Pick({sel}){return <div style={{display:'flex',flexWrap:'wrap',gap:8}}>{TYPES.map(t=><Chip key={t} selected={t===sel} onClick={()=>{}}>{t}</Chip>)}</div>}
function App(){return <div className="col">
<div><p className="lbl">Padrão · Novo Artefato</p><StepFlow step={1} total={6} title="Tipo e objetivo." description="Escolha o tipo de Artefato e para qual oportunidade ele serve."><Pick /></StepFlow></div>
<div><p className="lbl">Foco em Continuar · preenchido</p><StepFlow step={1} total={6} title="Tipo e objetivo." focused><Pick sel="Pitch pessoal" /><Input label="Objetivo" defaultValue="Vaga de analista júnior de IA generativa" /></StepFlow></div>
<div><p className="lbl">Preenchido · evidências autorizadas</p><StepFlow step={4} total={6} title="Selecionar e autorizar evidências." description="3 autorizadas (de 1 a 8). Só elas serão usadas no texto."><div style={{display:'flex',flexWrap:'wrap',gap:8}}>{EV.map(e=><Chip key={e} selected icon="check" onClick={()=>{}}>{e}</Chip>)}</div></StepFlow></div>
<div><p className="lbl">Erro</p><StepFlow step={5} total={6} title="Gerar." nextLabel="Gerar rascunho" nextVariant="brand" error="Não foi possível gerar o rascunho agora. Suas escolhas estão salvas; tente de novo." /></div>
<div><p className="lbl">Desabilitado · Continuar bloqueado</p><StepFlow step={4} total={6} title="Selecionar e autorizar evidências." nextDisabled nextDisabledReason="Selecione de 1 a 8 evidências"><span style={{fontSize:14,color:'var(--n-600)'}}>Nenhuma evidência autorizada.</span></StepFlow></div>
</div>}
ReactDOM.createRoot(document.getElementById('r')).render(<App />);
</script></body></html>
