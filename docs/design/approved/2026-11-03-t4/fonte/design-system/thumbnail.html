<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="styles.css">
<style>
html,body{width:100%;height:100%;min-width:0;min-height:0;margin:0;overflow:hidden}
*{box-sizing:border-box}
body{display:flex}
.main{flex:1;min-width:0;height:100%;background:var(--brand-gradient);display:flex;align-items:center;justify-content:center}
.mark{height:min(66vh,70vw);aspect-ratio:1/1;max-width:90%;max-height:90%;border-radius:12%;background:var(--n-0);box-shadow:var(--shadow-slab);display:flex;align-items:center;justify-content:center}
.mark img{width:75%;height:75%;object-fit:contain;display:block}
.strip{flex:0 0 12.5%;width:12.5%;height:100%;display:flex;flex-direction:column}
.strip div{flex:1 1 0;min-height:0}
</style>
</head>
<body><div class="main"><div class="mark"><img src="assets/logos/persona-logo-compacta.svg" alt="Persona"></div></div><div class="strip"><div style="background:var(--indigo-300)"></div><div style="background:var(--n-500)"></div><div style="background:var(--n-900)"></div></div></body>
</html>
