<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-card);font-family:var(--font-body);color:var(--text-strong)}.sw{display:flex;gap:8px}.s{flex:1;display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--text-muted)}.s i{display:block;height:64px;border-radius:14px;border:1px solid rgb(26 23 38 / .06)}.s b{color:var(--text-strong);font-weight:600;font-size:12px}</style></head><body><div class="sw"><div class="s"><i style="background:var(--tile-indigo)"></i><b>Indigo</b><span>#F1EEFD</span></div><div class="s"><i style="background:var(--tile-blue)"></i><b>Blue</b><span>#EAF1FE</span></div><div class="s"><i style="background:var(--tile-amber)"></i><b>Amber</b><span>#FEF6E4</span></div><div class="s"><i style="background:var(--tile-green)"></i><b>Green</b><span>#E8F8F1</span></div><div class="s"><i style="background:var(--tile-rose)"></i><b>Rose</b><span>#FDEEF2</span></div><div class="s"><i style="background:var(--tile-slate)"></i><b>Slate</b><span>#EEEDF4</span></div></div></body></html>
