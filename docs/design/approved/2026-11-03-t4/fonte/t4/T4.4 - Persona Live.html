<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>T4.4 — Persona Live</title>
<link rel="stylesheet" href="_ds/persona-design-system-ff1a7bce-a6f2-4fa9-af99-a6196b748678/tokens/fonts.css">
<link rel="stylesheet" href="_ds/persona-design-system-ff1a7bce-a6f2-4fa9-af99-a6196b748678/tokens/colors.css">
<link rel="stylesheet" href="_ds/persona-design-system-ff1a7bce-a6f2-4fa9-af99-a6196b748678/tokens/typography.css">
<link rel="stylesheet" href="_ds/persona-design-system-ff1a7bce-a6f2-4fa9-af99-a6196b748678/tokens/spacing.css">
<link rel="stylesheet" href="_ds/persona-design-system-ff1a7bce-a6f2-4fa9-af99-a6196b748678/tokens/effects.css">
<link rel="stylesheet" href="_ds/persona-design-system-ff1a7bce-a6f2-4fa9-af99-a6196b748678/styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds/persona-design-system-ff1a7bce-a6f2-4fa9-af99-a6196b748678/_ds_bundle.js"></script>
<style>
body{margin:0;background:#E9E8F0;font-family:var(--font-body);color:var(--text-strong)}
a{color:var(--brand)}a:hover{color:var(--brand-strong)}
.rv{position:relative;z-index:100;background:#E9E8F0;padding:14px 20px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--n-100)}
.rv-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rv-lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--n-600);margin-right:4px;min-width:72px}
.rv-sep{width:1px;height:24px;background:var(--n-200);margin:0 6px}
.rv-title{font-family:var(--font-display);font-size:16px;font-weight:700;letter-spacing:-.01em;margin-right:8px}
.rv-desc{margin:0;font-size:13px;color:var(--text-body);max-width:960px;text-wrap:pretty}
.stage{padding:20px}
.stage-frame{border-radius:12px;overflow:clip;box-shadow:var(--shadow-soft)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head>
<body><div id="root"></div>
<script type="text/babel" src="live-screen.jsx"></script>
<script type="text/babel">
const { Chip } = window.PersonaDesignSystem_ff1a7b;
const GROUPS = [
  ['Sessões', [
    ['sem-sessoes','Sem sessões','Vazio com explicação; “Nova sessão” é o único CTA de marca.'],
    ['lista','Lista','Grade de EntryCard: sessão Aurora (encerrada, evidências 1–3, §10) e duas sessões sintéticas. Duplicar por card.'],
    ['sem-resultado','Filtro sem resultado','Busca “fintech” sem correspondência; “Limpar filtros”.'],
    ['duplicando','Duplicando sessão','Cópia em criação; ações bloqueadas e anunciadas por status.'],
  ]],
  ['Preparação', [
    ['prep-vazia','Vazia','Empresa, vaga/objetivo, descrição opcional e seleção explícita.'],
    ['prep-validacao','Validação','Erros em campos e na seleção (1–8).'],
    ['prep-zero','Zero elegíveis','Sem evidências para autorizar; nada é inventado e iniciar fica indisponível.'],
    ['prep-selecao','Seleção 1–8','Evidências 1–3 selecionadas (3 de 8); empresa e vaga sintéticas.'],
    ['criando','Criando sessão','Preparação e seleção preservadas durante a criação.'],
  ]],
  ['Workspace', [
    ['pronta','Pronta','Sessão criada, sem pergunta. “Montar argumentos” é o CTA de marca.'],
    ['ativa','Ativa','Com histórico; escolha uma pergunta de exemplo e monte os argumentos (interativo).'],
    ['processando','Processando','Argumentos e rascunho em busca; controles de sessão bloqueados.'],
    ['resposta','Com resposta','Argumentos (evidência 2) antes do rascunho; ações nomeadas.'],
    ['lacuna','Com lacuna','Sem evidência para liderança; nenhum rascunho. “Registrar no Diário”.'],
    ['lacuna-enviada','Lacuna enviada','Lacuna encaminhada ao Diário.'],
    ['falha-ia','Falha da IA','Pergunta e seleção preservadas; “Tentar de novo”.'],
    ['pausada','Pausada','Tudo preservado; Retomar disponível.'],
    ['retomada','Retomada','Aviso de retomada com conteúdo preservado.'],
    ['encerrada','Encerrada','Somente leitura; Duplicar sessão.'],
  ]],
  ['Salvar', [
    ['salvando','Salvando STAR','Salvando nos Artefatos (status anunciado).'],
    ['falha-salvar','Falha ao salvar','Rascunho preservado; nova tentativa.'],
  ]],
];
const ALL = GROUPS.flatMap(g => g[1]);
const VH = { 1440: 900, 1280: 800, 1024: 768 };
const KEY = 'persona.t44.review';
function Review() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
  const qs = new URLSearchParams(location.search);
  const [v, setV] = React.useState(qs.get('s') || saved.v || 'lista');
  const [w, setW] = React.useState(+qs.get('w') || saved.w || 1440);
  const [agent, setAgent] = React.useState(qs.get('a') ? qs.get('a') === '1' : false);
  const stageRef = React.useRef(null);
  const [avail, setAvail] = React.useState(0);
  React.useLayoutEffect(() => { const el = stageRef.current; if (!el) return; const f = () => setAvail(el.clientWidth - 40); f(); const ro = new ResizeObserver(f); ro.observe(el); return () => ro.disconnect(); }, []);
  React.useEffect(() => { try { localStorage.setItem(KEY, JSON.stringify({ v, w })); } catch (e) {} }, [v, w]);
  const h = VH[w] || 900;
  const scale = avail > 0 ? Math.max(0.3, Math.min(1, avail / w)) : 1;
  const cur = ALL.find(x => x[0] === v) || ALL[1];
  return <>
    <div className="rv">
      <div className="rv-row"><span className="rv-title">T4.4 — Persona Live</span>
        <span className="rv-lbl">Largura</span>
        {[1440, 1280, 1024].map(x => <Chip key={x} size="sm" selected={w === x} onClick={() => setW(x)}>{x + ' × ' + VH[x]}</Chip>)}
        <span className="rv-sep"></span>
        <span className="rv-lbl">Agente</span>
        <Chip size="sm" selected={!agent} onClick={() => setAgent(false)}>Recolhido</Chip>
        <Chip size="sm" selected={agent} onClick={() => setAgent(true)}>Aberto</Chip>
      </div>
      {GROUPS.map(([g, items]) => <div key={g} className="rv-row"><span className="rv-lbl">{g}</span>{items.map(([id, label]) => <Chip key={id} size="sm" selected={v === id} onClick={() => setV(id)}>{label}</Chip>)}</div>)}
      <p className="rv-desc">{cur[2]} Viewport simulado {w} × {h}; “Dados sintéticos para demonstração”: empresa, vaga, perguntas e datas. {scale < 1 ? 'Pré-visualização a ' + Math.round(scale * 100) + '%.' : ''}</p>
    </div>
    <div className="stage" ref={stageRef} data-screen-label={cur[1] + ' · ' + w}>
      <div className="stage-frame" style={{ width: w, height: h, zoom: scale }}>
        <LiveScreen key={v + w} scenario={v} width={w} height={h} agentOpen={agent} onAgentToggle={setAgent} />
      </div>
    </div>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Review />);
</script>
</body></html>
