<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>T4.1 — Início</title>
<link rel="stylesheet" href="_ds/persona-design-system-ff1a7bce-a6f2-4fa9-af99-a6196b748678/tokens/fonts.css">
<link rel="stylesheet" href="_ds/persona-design-system-ff1a7bce-a6f2-4fa9-af99-a6196b748678/tokens/colors.css">
<link rel="stylesheet" href="_ds/persona-design-system-ff1a7bce-a6f2-4fa9-af99-a6196b748678/tokens/typography.css">
<link rel="stylesheet" href="_ds/persona-design-system-ff1a7bce-a6f2-4fa9-af99-a6196b748678/tokens/spacing.css">
<link rel="stylesheet" href="_ds/persona-design-system-ff1a7bce-a6f2-4fa9-af99-a6196b748678/tokens/effects.css">
<link rel="stylesheet" href="_ds/persona-design-system-ff1a7bce-a6f2-4fa9-af99-a6196b748678/styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds/persona-design-system-ff1a7bce-a6f2-4fa9-af99-a6196b748678/_ds_bundle.js"></script>
<style>
body{margin:0;background:#E9E8F0;font-family:var(--font-body);color:var(--text-strong)}
a{color:var(--brand)}a:hover{color:var(--brand-strong)}
.rv{position:relative;z-index:100;background:#E9E8F0;padding:14px 20px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--n-100)}
.rv-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rv-lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--n-600);margin-right:4px}
.rv-sep{width:1px;height:24px;background:var(--n-200);margin:0 6px}
.rv-title{font-family:var(--font-display);font-size:16px;font-weight:700;letter-spacing:-.01em;margin-right:8px}
.rv-desc{margin:0;font-size:13px;color:var(--text-body);max-width:900px;text-wrap:pretty}
.stage{padding:20px}
.stage-frame{border-radius:12px;overflow:clip;box-shadow:var(--shadow-soft)}
/* Composição da T4.1 sem rolagem aninhada: o AppShell cresce com o conteúdo e a página rola. overflow:clip só preserva os cantos, não cria área de rolagem. */
.inicio-root [data-agent]{overflow:clip!important;flex:1 1 auto;align-self:stretch}
.inicio-root [data-agent]>main{overflow:clip!important}
.inicio-root [data-shell-scroll]{overflow:visible!important}
.inicio-root [data-agent]>:first-child{position:sticky!important;top:16px;align-self:flex-start;height:calc(100vh - 32px)!important}
.inicio-rail{position:sticky;top:0;height:100vh}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head>
<body><div id="root"></div>
<script type="text/babel" src="inicio-screen.jsx"></script>
<script type="text/babel">
const { Chip } = window.PersonaDesignSystem_ff1a7b;
const VARIANTS = [
  ['completo', '1 · Completo', 'Dados suficientes. Score 65 com origem declarada; a próxima ação (revisar as 2 sugestões) aparece só no bloco focal.'],
  ['vazio', '2 · Vazio inicial', 'Diagnóstico feito, nenhum registro. Tudo aponta para o Diário; módulos sem dado são omitidos, não preenchidos.'],
  ['calculando', '3 · Dados insuficientes', '1 evidência confirmada, 1 registro em análise. Nenhum Score fabricado: cada dimensão mostra o que falta.'],
  ['falha', '4 · Falha parcial', 'Agente indisponível e análise do Score com erro. Jornada, destinos, revisões e atividade seguem úteis.'],
];
const KEY = 'persona.t41.review';
function Review() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
  const [v, setV] = React.useState(saved.v || 'completo');
  const [w, setW] = React.useState(+new URLSearchParams(location.search).get('w') || saved.w || 1440);
  const stageRef = React.useRef(null);
  const [avail, setAvail] = React.useState(0);
  React.useLayoutEffect(() => { const el = stageRef.current; if (!el) return; const f = () => setAvail(el.clientWidth - 40); f(); const ro = new ResizeObserver(f); ro.observe(el); return () => ro.disconnect(); }, []);
  React.useEffect(() => { try { localStorage.setItem(KEY, JSON.stringify({ v, w })); } catch (e) {} }, [v, w]);
  const frameRef = React.useRef(null);
  const [fh, setFh] = React.useState(0);
  React.useLayoutEffect(() => { const el = frameRef.current; if (!el) return; const f = () => setFh(el.offsetHeight); f(); const ro = new ResizeObserver(f); ro.observe(el); return () => ro.disconnect(); }, [v, w]);
  const vh = fh ? fh / window.innerHeight : 0;
  const scale = avail > 0 ? Math.max(0.3, Math.min(1, avail / w)) : 1;
  const cur = VARIANTS.find(x => x[0] === v);
  return <>
    <div className="rv">
      <div className="rv-row">
        <span className="rv-title">T4.1 — Início</span>
        <span className="rv-lbl">Estado</span>
        {VARIANTS.map(([id, label]) => <Chip key={id} size="sm" selected={v === id} onClick={() => setV(id)}>{label}</Chip>)}
        <span className="rv-sep"></span>
        <span className="rv-lbl">Largura</span>
        {[1440, 1280, 1024].map(x => <Chip key={x} size="sm" selected={w === x} onClick={() => setW(x)}>{x + ' px'}</Chip>)}
      </div>
      <p className="rv-desc">{cur[2]} Largura {w} px; altura natural, a página rola.{vh ? ' · Altura: ' + (fh / ({ 1920: 1080, 1536: 864, 1440: 900, 1366: 768, 1280: 800, 1024: 768 }[w] || 900)).toFixed(2).replace('.', ',') + ' viewports de ' + w + ' × ' + ({ 1920: 1080, 1536: 864, 1440: 900, 1366: 768, 1280: 800, 1024: 768 }[w] || 900) + '.' : ''}{scale > 0 && scale < 1 ? ' · Pré-visualização reduzida a ' + Math.round(scale * 100) + '%.' : ''}</p>
    </div>
    <div className="stage" ref={stageRef} data-screen-label={cur[1] + ' · ' + w}>
      <div>
        <div ref={frameRef} className="stage-frame" style={{ width: w, zoom: scale }}>
          <InicioScreen key={v + w} stateKey={v} width={w} />
        </div>
      </div>
    </div>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Review />);
</script>
</body></html>
